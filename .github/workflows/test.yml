name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

jobs:
  # ── Backend unit tests ──────────────────────────────────────────────────────
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        working-directory: web-programming
        run: |
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio pip-audit pytest-cov

      - name: Audit dependencies for known vulnerabilities
        working-directory: web-programming
        run: pip-audit -r backend/requirements.txt --ignore-vuln PYSEC-2022-42969

      - name: Run pytest
        working-directory: web-programming
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
          ENV: development
        run: python -m pytest backend/tests/ -v --tb=short --cov=backend --cov-report=term-missing --cov-config=.coveragerc

  # ── Frontend type-check ─────────────────────────────────────────────────────
  frontend-typecheck:
    name: Frontend typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web-programming/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: web-programming/frontend
        run: npm ci

      - name: Type-check
        working-directory: web-programming/frontend
        run: npm run typecheck

  # ── Frontend build ──────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    needs: frontend-typecheck

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web-programming/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: web-programming/frontend
        run: npm ci

      - name: Build
        working-directory: web-programming/frontend
        env:
          VITE_API_URL: http://localhost:8000
        run: npm run build



  # ── Playwright E2E tests ────────────────────────────────────────────────────
  e2e-tests:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        working-directory: web-programming
        run: pip install -r backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web-programming/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: web-programming/frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: web-programming/frontend
        run: npx playwright install --with-deps chromium

      - name: Start backend
        working-directory: web-programming
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
          ENV: development
          DATABASE_URL: sqlite:///./ci_test.db
        run: |
          python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000 &
          echo "Waiting for backend..."
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/health && break || sleep 2
          done

      - name: Start frontend
        working-directory: web-programming/frontend
        env:
          VITE_API_URL: http://localhost:8000
        run: |
          npm run dev -- --port 5173 &
          echo "Waiting for frontend..."
          for i in $(seq 1 15); do
            curl -sf http://localhost:5173 && break || sleep 2
          done

      - name: Run Playwright tests
        working-directory: web-programming/frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173
          PLAYWRIGHT_API_URL: http://localhost:8000
        run: npx playwright test --reporter=github

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web-programming/frontend/playwright-report/
          retention-days: 7

      - name: Upload Playwright traces and screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: web-programming/frontend/test-results/
          retention-days: 7

  # ── Deploy backend to DigitalOcean ─────────────────────────────────────────
  deploy-backend:
    name: Deploy backend → DigitalOcean
    runs-on: ubuntu-latest
    needs: [backend-tests, e2e-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_SSH_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            cd /app && git pull origin main
            cd /app/web-programming && source venv/bin/activate
            pip install --no-cache-dir -r backend/requirements.txt
            systemctl restart nuclei-ai

  # ── Deploy frontend to Cloudflare Pages ────────────────────────────────────
  # Disabled until CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are added.
  # To enable: add those secrets in GitHub → Settings → Secrets.
  deploy-frontend:
    name: Deploy frontend → Cloudflare Pages
    runs-on: ubuntu-latest
    needs: [frontend-build, e2e-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web-programming/frontend/package-lock.json

      - name: Install dependencies
        working-directory: web-programming/frontend
        run: npm ci

      - name: Build for production
        working-directory: web-programming/frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web-programming/frontend/dist --project-name=nuclei-ai-frontend --branch=main
